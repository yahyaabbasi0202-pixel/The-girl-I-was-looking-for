<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07061a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>The Girl I Was Looking For</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <canvas id="game"></canvas>

  <!-- ===== Title screen ===== -->
  <div id="title-screen" class="screen">
    <div class="title-inner">
      <div class="title-sparkle">✦ ✦ ✦</div>
      <h1 id="title-h1"></h1>
      <p id="title-quote"><span></span><span></span></p>
      <button id="btn-start" class="glow-btn hidden"></button>
      <button id="btn-continue" class="ghost-btn hidden"></button>
      <button id="btn-chapters" class="link-btn hidden">Chapters</button>
      <p class="title-hint hidden" id="title-hint">Best with sound on · headphones recommended</p>
    </div>
  </div>

  <div id="chapters-menu" class="screen hidden">
    <div class="menu-inner">
      <h2>Chapters</h2>
      <div id="chapters-list"></div>
      <button id="chapters-close" class="link-btn">← Back</button>
    </div>
  </div>

  <!-- ===== HUD ===== -->
  <div id="hud" class="hidden">
    <div id="hud-left">
      <div id="hud-chapter"></div>
      <div id="hud-objective"><i></i><span></span></div>
    </div>
    <button id="btn-mute" aria-label="Toggle music">♪</button>
  </div>

  <!-- ===== Touch controls ===== -->
  <div id="controls" class="hidden">
    <div id="joy"><div id="joy-knob"></div></div>
    <button id="btn-act" class="hidden"><span id="act-label">TALK</span><small id="act-key">E</small></button>
  </div>

  <!-- ===== Dialogue ===== -->
  <div id="dialogue" class="hidden">
    <canvas id="dlg-portrait" width="40" height="40"></canvas>
    <div id="dlg-body">
      <div id="dlg-name"></div>
      <div id="dlg-text"></div>
    </div>
    <div id="dlg-next">▼</div>
  </div>
  <div id="choices" class="hidden"></div>

  <!-- ===== Cinematic text / chapter card ===== -->
  <div id="cine"><div id="cine-text"></div></div>
  <div id="chapter-card"><div id="cc-num"></div><div id="cc-name"></div><div id="cc-line"></div></div>

  <!-- ===== Calendar ===== -->
  <div id="calendar" class="hidden">
    <div class="cal-card" id="cal-card">
      <div class="cal-head" id="cal-head"></div>
      <div class="cal-big" id="cal-big"></div>
      <div class="cal-sub" id="cal-sub"></div>
    </div>
  </div>

  <!-- ===== Waiting mini-game ===== -->
  <div id="wait-ui" class="hidden">
    <div id="wait-card">
      <div id="wait-clock">2:00 PM</div>
      <div id="wait-bar"><i id="wait-fill"></i></div>
      <div id="wait-label">Waiting by the gate…</div>
    </div>
    <button id="wait-btn">HOLD TO WAIT</button>
  </div>

  <!-- ===== Overlay for phones / puzzles ===== -->
  <div id="overlay" class="hidden"></div>

  <div id="bars-top" class="bar"></div>
  <div id="bars-bottom" class="bar"></div>
  <div id="fade"></div>
  <div id="toast"></div>
</div>

<script src="config.js"></script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="scenes.js"></script>
<script src="minigames.js"></script>
<script src="puzzles.js"></script>
<script src="story1.js"></script>
<script src="story2.js"></script>
<script src="story3.js"></script>
<script src="story4.js"></script>
<script src="game.js"></script>
</body>
</html>
